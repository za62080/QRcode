<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>QR暗号化データ 復号</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body><main class="app"><header><h1>QR Secure 復号</h1><p>スマートフォン・Windows・Mac対応。メール添付の .qrenc を保存して、この画面で復号します。</p>
<div class="steps"><strong>① 添付ファイルを保存</strong><span>→</span><strong>② ファイルを選択</strong><span>→</span><strong>③ パスワード入力</strong><span>→</span><strong>④ CSV保存</strong></div></header>
<section class="panel"><h2>1. 暗号化ファイル</h2><div id="dropZone" class="drop-zone">ここへ .qrenc をドラッグ＆ドロップ<br><strong>またはファイルを選択</strong></div><label class="file-label">.qrenc ファイルを選択<input id="file" type="file" accept=".qrenc,application/octet-stream"></label><p id="fileInfo" class="hint">ファイル未選択</p></section>
<section class="panel"><h2>2. パスワード</h2><label>復号パスワード<input id="password" type="password" autocomplete="current-password" placeholder="送信者から別経路で受け取ったパスワード"></label><div class="actions"><button id="decrypt" class="primary" disabled>復号する</button></div><p id="notice" class="notice" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>3. 復号結果</h2><textarea id="result" rows="12" readonly placeholder="復号されたCSVデータがここに表示されます"></textarea><div class="actions"><button id="save" disabled>CSVとして保存</button><button id="clear" disabled>画面から消去</button></div></section>
<p class="footnote">復号処理はブラウザ内だけで実行されます。選択したファイル、パスワード、復号結果をこのアプリ自身のサーバーへ送信しません。</p><nav class="receiver-link"><a href="../sender/">← QR読み取り・暗号化送信へ</a></nav></main></body></html>
